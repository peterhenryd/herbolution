[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.dependencies]
bytemuck = { version = "1.24.0", features = ["derive"] }
crossbeam-channel = "0.5.15"
fastrand = "2.3.0"
generational-arena = "0.2.9"
hashbrown = "0.16.0"
image = "0.25.8"
num_cpus = "1.17.0"
parking_lot = "0.12.5"
pollster = "0.4.0"
rayon = "1.11.0"
serde = { version = "1.0.228", features = ["derive"] }
smallvec = "2.0.0-alpha.11"
thiserror = "2.0.17"
time = "0.3.44"
toml = "0.9.8"
tracing = "0.1.41"
tracing-tracy = { version = "0.11.4", features = ["fibers"] }
clap = { version = "4.5.49", features = ["derive"] }
directories = "6.0.0"
fontdue = "0.9.3"
image-atlas = "0.4.1"
tracing-subscriber = "0.3.20"
wgpu = "27.0.1"
winit = "0.30.12"
num = "0.4.3"
static_assertions = "1.1.0"

[profile.dev]
opt-level = 3

[profile.dev.package."*"]
opt-level = 3
