[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
authors = ["peterhenryd <contact@peterhenryd.com>"]
license = "MIT"
repository = "https://github.com/peterhenryd/herbolution"

[workspace.dependencies]
arc-swap = "1.7.1"
bytemuck = "1.23.1"
crossbeam-channel = "0.5.15"
either = "1.15.0"
fastrand = "2.3.0"
fontdue = "0.9.3"
generational-arena = "0.2.9"
guillotiere = "0.6.2"
hashbrown = "0.15.4"
image = "0.25.6"
image-atlas = "0.4.1"
include_dir = "0.7.4"
line_drawing = "1.0.1"
lru = "0.16.0"
num = "0.4.3"
parking_lot = "0.12.4"
pollster = "0.4.0"
proc-macro2 = "1.0.95"
quote = "1.0.40"
rayon = "1.10.0"
serde = "1.0.219"
smallvec = "2.0.0-alpha.11"
syn = "2.0.104"
thiserror = "2.0.12"
time = "0.3.41"
tokio = "1.47.1"
toml = "0.9.2"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
tracing-tracy = { version = "0.11.4", features = ["fibers"] }
wgpu = "26.0.1"
winit = "0.30.12"

[profile.dev]
opt-level = 3